name: Cargo build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Create release for commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: commit-${{ github.sha }}
        run: |
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$TAG" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "Automated release for commit $GITHUB_SHA"

  build:
    name: Build ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: orels-linux-x86_64
            binary: orels
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            artifact: orels-linux-aarch64
            binary: orels
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: orels-windows-x86_64
            binary: orels.exe
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: orels-macos-aarch64
            binary: orels

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build with Cargo
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Upload binary to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.create-release.outputs.tag }}
          BINARY_PATH: target/${{ matrix.target }}/release/${{ matrix.binary }}
          ASSET_NAME: ${{ matrix.artifact }}
        run: |
          cp "$BINARY_PATH" "$ASSET_NAME"
          gh release upload "$TAG" "$ASSET_NAME" --clobber

  publish-release:
    name: Publish GitHub release
    needs:
      - create-release
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: gh release edit "$TAG" --draft=false
